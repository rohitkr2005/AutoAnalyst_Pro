<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AutoAnalyst Pro</title>
  
  <!-- Modern Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Color Scheme Meta & Theme Initialization (Prevents FOUC) -->
  <meta name="color-scheme" content="dark light">
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('analytica_theme_pref') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch(e) {}
    })();
  </script>

  <!-- Custom Vanilla CSS Design System -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- 3-Mode Theme Manager & Live 3D Background Engine -->
  <script src="/static/js/theme-3d.js"></script>
  
  <style>
    /* Dedicated Auth Portal Styling */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
      transition: background-color var(--transition-normal);
    }

    .auth-theme-header {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }

    /* Ambient animated glow backdrop */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { transform: translate(-80px, -60px) scale(0.9); }
      100% { transform: translate(100px, 80px) scale(1.15); }
    }

    .auth-card-container {
      width: 100%;
      max-width: 480px;
      z-index: 10;
      position: relative;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 1rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }

    .auth-header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }

    .auth-header p {
      color: #94a3b8;
      font-size: 0.88rem;
    }

    /* Auth Tab Switcher */
    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.75rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab-btn.active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.45rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 1rem;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 0.75rem 2.75rem 0.75rem 2.6rem;
      color: var(--text-primary);
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
      background: var(--bg-input-focus);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .toggle-pwd:hover {
      color: #cbd5e1;
    }

    /* Alert Banner */
    .auth-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      align-items: center;
      gap: 0.6rem;
    }

    .auth-alert.error {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, #7174f3 0%, #4f46e5 100%);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: #64748b;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider span {
      padding: 0 0.8rem;
    }

    /* Quick 1-Click Demo Login Button */
    .btn-demo {
      width: 100%;
      padding: 0.75rem;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
    }

    .btn-demo:hover {
      background: rgba(16, 185, 129, 0.22);
      border-color: #34d399;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
      transform: translateY(-1px);
    }

    .demo-credentials-note {
      text-align: center;
      font-size: 0.76rem;
      color: #64748b;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body class="auth-page">
  <!-- Live 3D Perspective Background Canvas -->
  <canvas id="bg-3d-canvas" class="bg-3d-canvas"></canvas>

  <div class="ambient-glow"></div>

  <!-- 3-Mode Theme Switcher on Auth Screen -->
  <div class="auth-theme-header">
    <div class="theme-switch-control" role="group" aria-label="Theme Selection">
      <button class="theme-btn" data-theme-val="light" onclick="setThemeMode('light')" title="Light Mode">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light</span>
      </button>
      <button class="theme-btn" data-theme-val="dark" onclick="setThemeMode('dark')" title="Dark Mode">
        <span class="theme-icon">🌙</span>
        <span class="theme-text">Dark</span>
      </button>
      <button class="theme-btn active" data-theme-val="system" onclick="setThemeMode('system')" title="Device Theme (Follows OS)">
        <span class="theme-icon">💻</span>
        <span class="theme-text">System</span>
      </button>
    </div>
  </div>

  <div class="auth-card-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <svg class="brand-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandLogoGradAuth" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4f46e5"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="barGradWhiteAuth" x1="0" y1="28" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#brandLogoGradAuth)"/>
            <rect x="6" y="18" width="4" height="8" rx="1.5" fill="url(#barGradWhiteAuth)"/>
            <rect x="13" y="13" width="4" height="13" rx="1.5" fill="url(#barGradWhiteAuth)"/>
            <rect x="20" y="8" width="4" height="18" rx="1.5" fill="#ffffff"/>
            <path d="M 7 15 L 14 10 L 22 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="22" cy="5" r="2.2" fill="#38bdf8"/>
          </svg>
        </div>
        <h1>AutoAnalyst Pro</h1>
        <p>Autonomous Data Science & Live Dashboard Studio</p>
      </div>

      <!-- Auth Tabs: Sign In / Create Account -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn" onclick="showAuthTab('login')">Sign In</button>
        <button class="auth-tab-btn" id="tab-register-btn" onclick="showAuthTab('register')">Create Account</button>
      </div>

      <!-- Status Alert Banner -->
      <div class="auth-alert" id="auth-alert">
        <span id="alert-icon">⚠️</span>
        <span id="alert-message">Error message</span>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Email</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="login-username" class="form-input" placeholder="admin or you@company.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('login-password')">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login-submit">
          Sign In to Workspace →
        </button>
      </form>

      <!-- REGISTRATION FORM -->
      <form id="form-register" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="reg-fullname">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">✨</span>
            <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Alex Mercer" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="reg-username" class="form-input" placeholder="e.g. alex_data" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Work Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="reg-email" class="form-input" placeholder="alex@company.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Create Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('reg-password')">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-reg-submit">
          Create Analyst Account →
        </button>
      </form>

      <!-- 1-Click Instant Demo Login -->
      <div class="divider">
        <span>Instant Testing</span>
      </div>

      <button type="button" class="btn-demo" onclick="performDemoLogin()">
        <span>⚡ 1-Click Demo Analyst Login</span>
      </button>
      <div class="demo-credentials-note">
        Pre-seeds demo account: <code>admin</code> / <code>Password123!</code>
      </div>

    </div>
  </div>

  <script>
    function showAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login-btn').classList.toggle('active', isLogin);
      document.getElementById('tab-register-btn').classList.toggle('active', !isLogin);
      document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
      hideAlert();
    }

    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    }

    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('auth-alert');
      const msgEl = document.getElementById('alert-message');
      const iconEl = document.getElementById('alert-icon');
      
      alertBox.className = 'auth-alert ' + (isSuccess ? 'success' : 'error');
      alertBox.style.display = 'flex';
      msgEl.textContent = msg;
      iconEl.textContent = isSuccess ? '✅' : '⚠️';
    }

    function hideAlert() {
      document.getElementById('auth-alert').style.display = 'none';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.textContent = 'Verifying Credentials...';

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showAlert('Authentication successful! Loading workspace...', true);
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showAlert(data.message || 'Invalid username or password.');
          btn.disabled = false;
          btn.textContent = 'Sign In to Workspace →';
        }
      } catch (err) {
        showAlert('Network or server connection error.');
        btn.disabled = false;
        btn.textContent = 'Sign In to Workspace →';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('btn-reg-submit');
      btn.disabled = true;
      btn.textContent = 'Registering Account...';

      const full_name = document.getElementById('reg-fullname').value;
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, username, email, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showAlert('Account created! Entering workspace...', true);
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showAlert(data.message || 'Registration failed.');
          btn.disabled = false;
          btn.textContent = 'Create Analyst Account →';
        }
      } catch (err) {
        showAlert('Network or server connection error.');
        btn.disabled = false;
        btn.textContent = 'Create Analyst Account →';
      }
    }

    async function performDemoLogin() {
      document.getElementById('login-username').value = 'admin';
      document.getElementById('login-password').value = 'Password123!';
      showAuthTab('login');
      document.getElementById('btn-login-submit').click();
    }
  </script>
</body>
</html>
